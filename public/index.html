<!doctype html>
<html>
  <head>
    <title>EduVerse</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">🎓 EduVerse</div>
      <div class="nav-links">
        <a href="#" class="register-link">Register</a>
        <a href="#" class="login-btn">Login</a>
      </div>
    </nav>
    <!-- MAIN HERO SECTION -->
    <div class="hero">
        
        <!-- LEFT SIDE: Text and Buttons -->
        <div class="hero-left">
            
            <!-- 1. The Big Title -->
            <h1>Verify documentation.<br>
                <span class="highlight">Spot fakes</span> seamlessly.
            </h1>
            
            <!-- 2. The Subtitle -->
            <p class="subtitle">Access thousands of certificates - academics and co-curricular</p>
            
            <!-- 3. The Buttons -->
            <div class="cta-group">
                <button class="explore-btn">Explore Colleges ➔</button>
                <div class="empty-box"></div>
            </div>

            <!-- 4. The Checkmarks -->
            <div class="features">
                <div class="feature-item"><span class="checkmark">✔</span> 2,500+ Certified Colleges</div>
                <div class="feature-item"><span class="checkmark">✔</span> Verification made basic</div>
                <div class="feature-item"><span class="checkmark">✔</span> Secure and Accurate</div>
            </div>

        </div>

    </div>
  </body>
</html>
